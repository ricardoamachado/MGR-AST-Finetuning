[project]
name = "mgr-ast-finetuning"
version = "0.1.0"
description = "Fine-tuning do Audio Spectrogram Transformer para classificação de áudio."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.10.1",
    "ipykernel>=7.1.0",
    "polars>=1.34.0",
    "pyarrow>=21.0.0",
    "scikit-learn>=1.9.1",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "transformers>=4.57.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ast_finetuning"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchaudio = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
